
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Droptechify Portal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/portal-style.css">
      <link rel="icon" type="image/png" href="/attached_assets/logo.png" />

    <link rel="apple-touch-icon" href="/attached_assets/logo.png" />
    <link rel="shortcut icon" href="/attached_assets/logo.png" />

    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="/portal-script.js" defer></script>
  </head>

  <body>
    <!-- 🔹 Video Section -->
    <div class="video-section">
      <div class="video-box" id="videoContainer">
        <div class="video-placeholder">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <p class="video-title">No video available</p>
          <p class="video-subtitle">The admin will upload a video soon</p>
        </div>
      </div>
    </div>

    <!-- 🔹 Form Section -->
    <div class="form-container">
      <div id="successMessage" class="success-message">
        Thank you! Your message has been submitted successfully.
      </div>

      <h2>Request a Website / Project Information</h2>

      <form id="contactForm">
        <div>
          <label>Full Name</label>
          <input type="text" name="fullname" placeholder="Enter your full name" required />
        </div>

        <div>
          <label>WhatsApp / WeChat Number</label>
          <input
            type="text"
            name="contact"
            placeholder="+12xxxxxxxxxx or your WeChat ID"
            required
          />
        </div>

        <div>
          <label>Company Name</label>
          <input type="text" name="company" placeholder="Enter your company name" required />
        </div>

        <div>
          <label>Email Address (optional)</label>
          <input type="email" name="email" placeholder="example@company.com" />
        </div>

        <div>
          <label>Project Details</label>
          <textarea
            name="message"
            placeholder="Write a few lines about your project or idea..."
          ></textarea>
        </div>

        <button type="submit" id="submitBtn">Submit Information</button>
      </form>
    </div>

    <p class="footer-note">Droptechify © 2025 — All Rights Reserved</p>

  </body>
</html>
